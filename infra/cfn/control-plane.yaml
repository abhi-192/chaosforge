AWSTemplateFormatVersion: '2010-09-09'
Description: ChaosForge Control Plane (API, Orchestrator, DynamoDB, Evidence)

Parameters:
  OrgName:
    Type: String
    Description: Organization name (used for ExternalId format and tagging)
  ArtifactsBucket:
    Type: String
    Description: S3 bucket containing Lambda zip artifacts
  ArtifactsPrefix:
    Type: String
    Default: chaosforge
    Description: S3 key prefix for Lambda zip artifacts
  EnableApi:
    Type: String
    Default: 'true'
    AllowedValues: ['true','false']

  NotifySnsTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN for ChatOps notifications

  SlackWebhookParam:
    Type: String
    Default: ""
    Description: Optional SSM parameter name (SecureString) with Slack incoming webhook URL

Conditions:
  CreateApi: !Equals [!Ref EnableApi, 'true']
  HasNotifyTopic: !Not [!Equals [!Ref NotifySnsTopicArn, ""]]
  HasSlackParam: !Not [!Equals [!Ref SlackWebhookParam, ""]]

Resources:
  EvidenceKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${AWS::StackName} evidence key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRoot
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt EvidenceKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${EvidenceBucket.Arn}'
              - !Sub '${EvidenceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # DynamoDB tables
  TemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ChaosTemplates'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: templateId
          AttributeType: S
        - AttributeName: version
          AttributeType: N
      KeySchema:
        - AttributeName: templateId
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE

  PluginsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ChaosPlugins'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pluginId
          AttributeType: S
        - AttributeName: version
          AttributeType: N
      KeySchema:
        - AttributeName: pluginId
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE

  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ChaosRuns'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runId
          AttributeType: S
      KeySchema:
        - AttributeName: runId
          KeyType: HASH

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ChaosRunEvents'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: runId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ApprovalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ChaosApprovals'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: approvalId
          AttributeType: S
      KeySchema:
        - AttributeName: approvalId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ChaosAccounts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH

  PoliciesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ChaosPolicies'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: env
          AttributeType: S
        - AttributeName: version
          AttributeType: N
      KeySchema:
        - AttributeName: env
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE

  # IAM roles
  CoreLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ChaosForgeCoreLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ChaosForgeCoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Dynamo
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt TemplatesTable.Arn
                  - !GetAtt PluginsTable.Arn
                  - !GetAtt RunsTable.Arn
                  - !GetAtt EventsTable.Arn
                  - !GetAtt ApprovalsTable.Arn
                  - !GetAtt AccountsTable.Arn
                  - !GetAtt PoliciesTable.Arn
              - Sid: CloudWatchRead
                Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                Resource: '*'
              - Sid: StepFunctions
                Effect: Allow
                Action:
                  - states:StartExecution
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                Resource: '*'
              - Sid: InvokePlugins
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt PluginEC2Stop.Arn
                  - !GetAtt PluginEC2Terminate.Arn
                  - !GetAtt PluginSSMNetem.Arn
                  - !GetAtt PluginSSMStressng.Arn
                  - !GetAtt PluginALBBlackhole.Arn
              - Sid: SSMWrite
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chaos/*'
              - Sid: EvidenceWrite
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub '${EvidenceBucket.Arn}/*'
              - Sid: KmsUse
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt EvidenceKey.Arn
              - !If
                - HasNotifyTopic
                - Sid: NotifyPublish
                  Effect: Allow
                  Action:
                    - sns:Publish
                  Resource: !Ref NotifySnsTopicArn
                - !Ref AWS::NoValue

  PluginLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ChaosForgePluginLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ChaosForgePluginAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssumeTargets
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: 'arn:aws:iam::*:role/ChaosTargetExecutionRole-*'
              - Sid: AccountsRead
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt AccountsTable.Arn

  # Lambda functions (core)
  ApiFunction:
    Type: AWS::Lambda::Function
    Condition: CreateApi
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Role: !GetAtt CoreLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/api.zip'
      Environment:
        Variables:
          CHAOS_TEMPLATES_TABLE: !Ref TemplatesTable
          CHAOS_PLUGINS_TABLE: !Ref PluginsTable
          CHAOS_RUNS_TABLE: !Ref RunsTable
          CHAOS_EVENTS_TABLE: !Ref EventsTable
          CHAOS_APPROVALS_TABLE: !Ref ApprovalsTable
          CHAOS_ACCOUNTS_TABLE: !Ref AccountsTable
          CHAOS_POLICIES_TABLE: !Ref PoliciesTable
          CHAOS_SFN_ARN: !Ref Orchestrator
          CHAOS_NOTIFY_SNS_TOPIC_ARN: !Ref NotifySnsTopicArn
          CHAOS_NOTIFY_SLACK_WEBHOOK_PARAM: !Ref SlackWebhookParam

  PlannerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-planner'
      Role: !GetAtt CoreLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 60
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/planner.zip'
      Environment:
        Variables:
          CHAOS_TEMPLATES_TABLE: !Ref TemplatesTable
          CHAOS_PLUGINS_TABLE: !Ref PluginsTable
          CHAOS_RUNS_TABLE: !Ref RunsTable
          CHAOS_EVENTS_TABLE: !Ref EventsTable
          CHAOS_POLICIES_TABLE: !Ref PoliciesTable

  AlarmCheckerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-alarmchecker'
      Role: !GetAtt CoreLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/alarmchecker.zip'
      Environment:
        Variables:
          CHAOS_TEMPLATES_TABLE: !Ref TemplatesTable
          CHAOS_RUNS_TABLE: !Ref RunsTable
          CHAOS_EVENTS_TABLE: !Ref EventsTable

  ApprovalWaiterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-approvalwaiter'
      Role: !GetAtt CoreLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 60
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/approvalwaiter.zip'
      Environment:
        Variables:
          CHAOS_APPROVALS_TABLE: !Ref ApprovalsTable
          CHAOS_RUNS_TABLE: !Ref RunsTable
          CHAOS_EVENTS_TABLE: !Ref EventsTable
          CHAOS_NOTIFY_SNS_TOPIC_ARN: !Ref NotifySnsTopicArn
          CHAOS_NOTIFY_SLACK_WEBHOOK_PARAM: !Ref SlackWebhookParam

  PluginExecutorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-pluginexecutor'
      Role: !GetAtt CoreLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/pluginexecutor.zip'
      Environment:
        Variables:
          CHAOS_TEMPLATES_TABLE: !Ref TemplatesTable
          CHAOS_PLUGINS_TABLE: !Ref PluginsTable
          CHAOS_RUNS_TABLE: !Ref RunsTable
          CHAOS_EVENTS_TABLE: !Ref EventsTable

  MonitorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-monitor'
      Role: !GetAtt CoreLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 60
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/monitor.zip'
      Environment:
        Variables:
          CHAOS_TEMPLATES_TABLE: !Ref TemplatesTable
          CHAOS_RUNS_TABLE: !Ref RunsTable
          CHAOS_EVENTS_TABLE: !Ref EventsTable

  ReporterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-reporter'
      Role: !GetAtt CoreLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 120
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/reporter.zip'
      Environment:
        Variables:
          CHAOS_TEMPLATES_TABLE: !Ref TemplatesTable
          CHAOS_RUNS_TABLE: !Ref RunsTable
          CHAOS_EVENTS_TABLE: !Ref EventsTable
          CHAOS_EVIDENCE_BUCKET: !Ref EvidenceBucket
          CHAOS_EVIDENCE_KMS_KEY_ARN: !GetAtt EvidenceKey.Arn
          CHAOS_NOTIFY_SNS_TOPIC_ARN: !Ref NotifySnsTopicArn
          CHAOS_NOTIFY_SLACK_WEBHOOK_PARAM: !Ref SlackWebhookParam

  AbortFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-abort'
      Role: !GetAtt CoreLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/abort.zip'
      Environment:
        Variables:
          CHAOS_RUNS_TABLE: !Ref RunsTable
          CHAOS_EVENTS_TABLE: !Ref EventsTable

  # Plugin functions
  PluginEC2Stop:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-plugin-ec2-stop'
      Role: !GetAtt PluginLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/plugin-ec2-stop.zip'
      Environment:
        Variables:
          CHAOS_ORG_NAME: !Ref OrgName
          CHAOS_ACCOUNTS_TABLE: !Ref AccountsTable

  PluginEC2Terminate:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-plugin-ec2-terminate'
      Role: !GetAtt PluginLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/plugin-ec2-terminate.zip'
      Environment:
        Variables:
          CHAOS_ORG_NAME: !Ref OrgName
          CHAOS_ACCOUNTS_TABLE: !Ref AccountsTable

  PluginSSMNetem:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-plugin-ssm-netem'
      Role: !GetAtt PluginLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/plugin-ssm-netem.zip'
      Environment:
        Variables:
          CHAOS_ORG_NAME: !Ref OrgName
          CHAOS_ACCOUNTS_TABLE: !Ref AccountsTable

  PluginSSMStressng:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-plugin-ssm-stressng'
      Role: !GetAtt PluginLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/plugin-ssm-stressng.zip'
      Environment:
        Variables:
          CHAOS_ORG_NAME: !Ref OrgName
          CHAOS_ACCOUNTS_TABLE: !Ref AccountsTable

  PluginALBBlackhole:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-plugin-alb-blackhole'
      Role: !GetAtt PluginLambdaRole.Arn
      Runtime: go1.x
      Handler: main
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Sub '${ArtifactsPrefix}/plugin-alb-blackhole.zip'
      Environment:
        Variables:
          CHAOS_ORG_NAME: !Ref OrgName
          CHAOS_ACCOUNTS_TABLE: !Ref AccountsTable

  # Orchestrator role
  OrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ChaosForgeOrchestratorRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ChaosForgeOrchestratorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Invoke
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt PlannerFunction.Arn
                  - !GetAtt AlarmCheckerFunction.Arn
                  - !GetAtt ApprovalWaiterFunction.Arn
                  - !GetAtt PluginExecutorFunction.Arn
                  - !GetAtt MonitorFunction.Arn
                  - !GetAtt ReporterFunction.Arn
                  - !GetAtt AbortFunction.Arn
              - Sid: DynamoRead
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt RunsTable.Arn
              - Sid: SSMRead
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chaos/*'

  Orchestrator:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${AWS::StackName}-ChaosRunOrchestrator'
      RoleArn: !GetAtt OrchestratorRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "ChaosForge Run Orchestrator",
          "StartAt": "LoadRun",
          "States": {
            "LoadRun": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:getItem",
              "Parameters": {
                "TableName": "${RunsTable}",
                "Key": { "runId": { "S.$": "$.runId" } }
              },
              "ResultPath": "$.run",
              "Next": "CheckKillSwitch"
            },
            "CheckKillSwitch": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ssm:getParameter",
              "Parameters": {
                "Name.$": "States.Format('/chaos/{}/kill-switch', $.run.Item.env.S)"
              },
              "ResultPath": "$.killSwitch",
              "Next": "KillSwitchDecision",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.killSwitchError",
                  "Next": "PlanTargets"
                }
              ]
            },
            "KillSwitchDecision": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.killSwitch.Parameter.Value",
                  "StringEquals": "ENGAGED",
                  "Next": "AbortDueToKillSwitch"
                }
              ],
              "Default": "PlanTargets"
            },
            "AbortDueToKillSwitch": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${AbortFunction.Arn}",
                "Payload": { "runId.$": "$.run.Item.runId.S", "reason": "Kill-switch engaged" }
              },
              "End": true
            },
            "PlanTargets": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PlannerFunction.Arn}",
                "Payload": { "runId.$": "$.run.Item.runId.S" }
              },
              "ResultPath": "$.plan",
              "Next": "ApprovalRequired?"
            },
            "ApprovalRequired?": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.run.Item.approvalRequired.BOOL",
                  "BooleanEquals": true,
                  "Next": "WaitForApproval"
                }
              ],
              "Default": "PreflightAlarms"
            },
            "WaitForApproval": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
              "Parameters": {
                "FunctionName": "${ApprovalWaiterFunction.Arn}",
                "Payload": {
                  "runId.$": "$.run.Item.runId.S",
                  "taskToken.$": "$$.Task.Token"
                }
              },
              "ResultPath": "$.approval",
              "Next": "PreflightAlarms"
            },
            "PreflightAlarms": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${AlarmCheckerFunction.Arn}",
                "Payload": { "runId.$": "$.run.Item.runId.S", "mode": "preflight" }
              },
              "ResultPath": "$.preflight",
              "Next": "PreflightOK?"
            },
            "PreflightOK?": {
              "Type": "Choice",
              "Choices": [
                { "Variable": "$.preflight.Payload.ok", "BooleanEquals": true, "Next": "Inject" }
              ],
              "Default": "AbortDueToPreflight"
            },
            "AbortDueToPreflight": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${AbortFunction.Arn}",
                "Payload": { "runId.$": "$.run.Item.runId.S", "reason": "Preflight alarm check failed" }
              },
              "End": true
            },
            "Inject": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PluginExecutorFunction.Arn}",
                "Payload": { "runId.$": "$.run.Item.runId.S", "action": "inject" }
              },
              "ResultPath": "$.inject",
              "Next": "MonitorLoop"
            },
            "MonitorLoop": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${MonitorFunction.Arn}",
                "Payload": { "runId.$": "$.run.Item.runId.S" }
              },
              "ResultPath": "$.monitor",
              "Next": "StopAlarmFired?"
            },
            "StopAlarmFired?": {
              "Type": "Choice",
              "Choices": [
                { "Variable": "$.monitor.Payload.stopAlarmFired", "BooleanEquals": true, "Next": "Rollback" },
                { "Variable": "$.monitor.Payload.done", "BooleanEquals": true, "Next": "PostCheckAlarms" }
              ],
              "Default": "WaitBeforeNextMonitor"
            },
            "WaitBeforeNextMonitor": {
              "Type": "Wait",
              "Seconds": 30,
              "Next": "MonitorLoop"
            },
            "Rollback": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${PluginExecutorFunction.Arn}",
                "Payload": { "runId.$": "$.run.Item.runId.S", "action": "rollback" }
              },
              "ResultPath": "$.rollback",
              "Next": "PostCheckAlarms"
            },
            "PostCheckAlarms": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${AlarmCheckerFunction.Arn}",
                "Payload": { "runId.$": "$.run.Item.runId.S", "mode": "postcheck" }
              },
              "ResultPath": "$.postcheck",
              "Next": "Finalize"
            },
            "Finalize": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ReporterFunction.Arn}",
                "Payload": { "runId.$": "$.run.Item.runId.S" }
              },
              "End": true
            }
          }
        }

  # API Gateway HTTP API
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: CreateApi
    Properties:
      Name: !Sub '${AWS::StackName}-ChaosForgeApi'
      ProtocolType: HTTP

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: CreateApi
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  RouteHealth:
    Type: AWS::ApiGatewayV2::Route
    Condition: CreateApi
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /health'
      Target: !Join ['/', ['integrations', !Ref ApiIntegration]]
      AuthorizationType: AWS_IAM

  RouteRunsPost:
    Type: AWS::ApiGatewayV2::Route
    Condition: CreateApi
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /runs'
      Target: !Join ['/', ['integrations', !Ref ApiIntegration]]
      AuthorizationType: AWS_IAM

  RouteRunsGet:
    Type: AWS::ApiGatewayV2::Route
    Condition: CreateApi
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /runs/{runId}'
      Target: !Join ['/', ['integrations', !Ref ApiIntegration]]
      AuthorizationType: AWS_IAM

  RouteApprove:
    Type: AWS::ApiGatewayV2::Route
    Condition: CreateApi
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /approvals/{runId}/approve'
      Target: !Join ['/', ['integrations', !Ref ApiIntegration]]
      AuthorizationType: AWS_IAM

  RouteReject:
    Type: AWS::ApiGatewayV2::Route
    Condition: CreateApi
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /approvals/{runId}/reject'
      Target: !Join ['/', ['integrations', !Ref ApiIntegration]]
      AuthorizationType: AWS_IAM

  RouteKillEngage:
    Type: AWS::ApiGatewayV2::Route
    Condition: CreateApi
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /killswitch/engage'
      Target: !Join ['/', ['integrations', !Ref ApiIntegration]]
      AuthorizationType: AWS_IAM

  RouteKillDisengage:
    Type: AWS::ApiGatewayV2::Route
    Condition: CreateApi
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /killswitch/disengage'
      Target: !Join ['/', ['integrations', !Ref ApiIntegration]]
      AuthorizationType: AWS_IAM

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: CreateApi
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  ApiPermission:
    Type: AWS::Lambda::Permission
    Condition: CreateApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'

Outputs:
  ApiEndpoint:
    Condition: CreateApi
    Value: !GetAtt HttpApi.ApiEndpoint
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  EvidenceKeyArn:
    Value: !GetAtt EvidenceKey.Arn
  RunsTableName:
    Value: !Ref RunsTable
  TemplatesTableName:
    Value: !Ref TemplatesTable
  PluginsTableName:
    Value: !Ref PluginsTable
  PoliciesTableName:
    Value: !Ref PoliciesTable
  AccountsTableName:
    Value: !Ref AccountsTable
  ApprovalsTableName:
    Value: !Ref ApprovalsTable
  EventsTableName:
    Value: !Ref EventsTable
  OrchestratorArn:
    Value: !Ref Orchestrator
  PluginRoleArn:
    Value: !GetAtt PluginLambdaRole.Arn
